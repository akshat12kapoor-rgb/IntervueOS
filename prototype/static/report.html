<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>IntervueOS — your interview report</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0c0e; --panel: #141619; --line: #24272c;
    --ink: #e9eaec; --dim: #8b9099; --faint: #5c6270;
    --accent: #6ea8fe; --warm: #f0a868; --good: #5bd6a0; --bad: #f2765c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.6 ui-sans-serif, -apple-system, "SF Pro Text", Inter, system-ui, sans-serif;
    padding: 40px 24px 80px;
  }
  main { width: min(820px, 100%); margin: 0 auto; }
  h1 { font-size: 26px; margin: 0 0 6px; letter-spacing: -0.02em; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em;
       color: var(--dim); margin: 36px 0 12px; font-weight: 600; }
  .meta { color: var(--dim); font-size: 13px; margin-bottom: 28px; }
  .headline {
    font-size: 20px; line-height: 1.45; background: var(--panel);
    border: 1px solid var(--line); border-left: 3px solid var(--accent);
    border-radius: 12px; padding: 20px 22px;
  }
  .caveat {
    background: rgba(240,168,104,.08); border: 1px solid rgba(240,168,104,.3);
    border-radius: 10px; padding: 14px 16px; color: var(--warm);
    font-size: 13.5px; margin-top: 16px;
  }
  .q { background: var(--panel); border: 1px solid var(--line);
       border-radius: 12px; padding: 18px 20px; margin-bottom: 12px; }
  .qhead { display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px; }
  .score { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 15px;
           border-radius: 6px; padding: 1px 9px; flex: none; }
  .intent { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em;
            color: var(--faint); margin-bottom: 10px; }
  .question { font-weight: 600; }
  .verdict { color: var(--dim); margin-top: 8px; }
  blockquote { margin: 10px 0 0; padding: 7px 0 7px 14px;
               border-left: 2px solid var(--line); color: var(--ink);
               font-style: italic; }
  .better { margin-top: 10px; font-size: 13.5px; color: var(--accent); }
  ul { margin: 0; padding-left: 20px; }
  li { margin-bottom: 7px; }
  .unanswered { color: var(--faint); font-style: italic; margin-top: 8px; }
  .foot { margin-top: 44px; padding-top: 18px; border-top: 1px solid var(--line);
          color: var(--faint); font-size: 12.5px; }
  a { color: var(--accent); }
  .state { color: var(--dim); padding: 50px 0; text-align: center; }
  .spin { display: inline-block; width: 9px; height: 9px; border-radius: 50%;
          background: var(--accent); margin-right: 8px; }
</style>
</head>
<body>
<main id="root">
  <div class="state"><span class="spin"></span> Building your report…</div>
</main>
<script>
const id = location.pathname.split("/").pop();
const root = document.getElementById("root");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => (
  { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const SCORE_COLOR = (n) =>
  n >= 4 ? "var(--good)" : n <= 2 ? "var(--bad)" : "var(--warm)";

function renderQuestion(ex, a) {
  const score = a && typeof a.score === "number" ? a.score : null;
  const chip = score === null
    ? `<span class="score" style="background:#1c1f25;color:var(--faint)">—</span>`
    : `<span class="score" style="background:${SCORE_COLOR(score)}1f;color:${SCORE_COLOR(score)}">${score}/5</span>`;

  // The intent comes from the engine's recorded objective, not the model:
  // the report can always say what the interviewer was testing.
  return `<div class="q">
    <div class="qhead">${chip}<div class="question">${esc(ex.question)}</div></div>
    <div class="intent">Testing: ${esc(ex.intent)} &nbsp;·&nbsp; ${esc(ex.topic)}</div>
    ${!ex.answered
      ? `<div class="unanswered">Not answered — the interview moved on or ended here.</div>`
      : !ex.scored
      ? `<div class="unanswered">A topic change, not a question under examination — not scored.</div>`
      : `${a && a.verdict ? `<div class="verdict">${esc(a.verdict)}</div>` : ""}
         ${a && a.evidence ? `<blockquote>“${esc(a.evidence)}”</blockquote>` : ""}
         ${a && a.better ? `<div class="better">Stronger: ${esc(a.better)}</div>` : ""}`}
  </div>`;
}

function list(title, items) {
  if (!items || !items.length) return "";
  return `<h2>${title}</h2><ul>${items.map(i => `<li>${esc(i)}</li>`).join("")}</ul>`;
}

function render(p) {
  if (p.status === "failed") {
    root.innerHTML = `<h1>The report could not be generated</h1>
      <div class="meta">Your transcript is intact below — only the assessment failed.</div>
      <div class="caveat">${esc(p.error || "Unknown error.")}</div>
      ${(p.evidence?.exchanges || []).map(ex => renderQuestion(ex, null)).join("")}
      <div class="foot"><a href="/">Start another interview</a></div>`;
    return;
  }

  const a = p.assessment, ev = p.evidence;
  const byIndex = new Map((a.per_question || []).map(q => [q.index, q]));
  const mins = Math.round((ev.duration_s || 0) / 60);

  root.innerHTML = `
    <h1>Your interview report</h1>
    <div class="meta">${esc(ev.role)} · ${mins} min ·
      ${ev.exchanges.length} questions · topics: ${esc((ev.topics_covered || []).join(", ") || "—")}</div>
    <div class="headline">${esc(a.headline)}</div>
    ${p.caveat ? `<div class="caveat">${esc(p.caveat)}</div>` : ""}
    <h2>Question by question</h2>
    ${ev.exchanges.map(ex => renderQuestion(ex, byIndex.get(ex.index))).join("")}
    ${list("What you did well", a.strengths)}
    ${list("Where it was thin", a.gaps)}
    ${list("What to do differently", a.advice)}
    <div class="foot">
      Assessed by ${esc(a.prompt_version)}. Judgements are anchored to what you
      actually said — every quote above is from your own answers.
      This report lives in memory only and is lost when the server restarts, so
      save the page if you want to keep it. &nbsp;·&nbsp;
      <a href="/">Start another interview</a>
    </div>`;
}

let tries = 0;
async function poll() {
  try {
    const res = await fetch(`/api/report/${id}`);
    if (res.status === 404) {
      root.innerHTML = `<h1>No such report</h1>
        <div class="meta">It may have expired — reports are kept in memory and
        lost when the server restarts.</div>
        <div class="foot"><a href="/">Start another interview</a></div>`;
      return;
    }
    const p = await res.json();
    if (p.status === "pending") {
      if (++tries > 90) {
        root.innerHTML = `<h1>Still working</h1><div class="meta">The assessor is
          taking unusually long. Reload to check again.</div>`;
        return;
      }
      setTimeout(poll, 1000);
      return;
    }
    render(p);
  } catch (e) {
    root.innerHTML = `<div class="state">Could not reach the server. Reload to retry.</div>`;
  }
}
poll();
</script>
</body>
</html>
