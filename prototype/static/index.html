<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>IntervueOS — prototype</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0c0e; --panel: #141619; --line: #24272c;
    --ink: #e9eaec; --dim: #8b9099; --accent: #6ea8fe; --warm: #f0a868;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 ui-sans-serif, -apple-system, "SF Pro Text", Inter, system-ui, sans-serif;
    min-height: 100vh; display: grid; place-items: center; padding: 24px;
  }
  .card {
    width: min(720px, 100%); background: var(--panel);
    border: 1px solid var(--line); border-radius: 16px; padding: 28px;
  }
  h1 { font-size: 19px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--dim); font-size: 13px; margin: 0 0 22px; }
  label { display: block; font-size: 12px; color: var(--dim); margin: 14px 0 5px;
          text-transform: uppercase; letter-spacing: .06em; }
  input, textarea, select {
    width: 100%; background: #0e1013; color: var(--ink);
    border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px;
    font: inherit; font-size: 14px;
  }
  textarea { min-height: 78px; resize: vertical; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .row { display: grid; grid-template-columns: 1fr 160px; gap: 14px; }
  button {
    background: var(--accent); color: #08101f; border: 0; border-radius: 9px;
    padding: 11px 18px; font: inherit; font-weight: 600; cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--dim); border: 1px solid var(--line); font-weight: 500; }
  button:hover { filter: brightness(1.08); }
  #start { width: 100%; margin-top: 24px; padding: 13px; }

  /* interview room */
  .head { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 1px solid var(--line); padding-bottom: 14px; margin-bottom: 30px; }
  .head .role { font-size: 13px; color: var(--dim); }
  #timer { font-variant-numeric: tabular-nums; font-size: 15px; color: var(--dim); }
  #question {
    font-size: 21px; line-height: 1.45; letter-spacing: -0.01em;
    min-height: 4.4em; margin: 0 0 30px;
  }
  .stage { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 26px; }
  #orb {
    --level: 0; width: 54px; height: 54px; border-radius: 50%;
    background: #1c2027; border: 1px solid var(--line);
    transition: background .18s, border-color .18s, transform .08s;
    transform: scale(calc(1 + var(--level) * 0.14));
  }
  #orb[data-mode="listening"] { background: #16232f; border-color: var(--accent); }
  #orb[data-mode="speaking"]  { background: #2a2118; border-color: var(--warm); transform: none; }
  #status { font-size: 13px; color: var(--dim); }
  .controls { display: flex; gap: 10px; justify-content: center; }
  #transcript { margin-top: 26px; max-height: 260px; overflow-y: auto;
                border-top: 1px solid var(--line); padding-top: 16px; }
  .line { display: grid; grid-template-columns: 84px 1fr; gap: 12px; margin-bottom: 11px; font-size: 13.5px; }
  .line .who { color: var(--dim); font-size: 11px; text-transform: uppercase;
               letter-spacing: .06em; padding-top: 2px; }
  .line.interviewer .what { color: var(--ink); }
  .line.candidate .what { color: #b9bec7; }
  .line.cut .what { opacity: .55; font-style: italic; }
  #summary { margin-top: 20px; background: #0e1013; border: 1px solid var(--line);
             border-radius: 9px; padding: 14px; font-size: 12.5px;
             font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
             white-space: pre-wrap; color: var(--dim); }
  .note { margin-top: 18px; font-size: 12px; color: var(--dim); line-height: 1.5; }
</style>
</head>
<body>

<div class="card" id="setup">
  <h1>IntervueOS</h1>
  <p class="sub">Voice interview prototype. Speak naturally — you can interrupt.</p>

  <div class="row">
    <div>
      <label for="role">Role</label>
      <input id="role" value="Senior Backend Engineer" />
    </div>
    <div>
      <label for="duration">Length</label>
      <select id="duration">
        <option value="300">5 minutes</option>
        <option value="600" selected>10 minutes</option>
      </select>
    </div>
  </div>

  <label for="topics">Topics (comma separated)</label>
  <input id="topics" value="a system you designed, how you handle data at scale, a time it broke" />

  <label for="jd">Job description</label>
  <textarea id="jd" placeholder="Paste the job description."></textarea>

  <label for="resume">Your resume</label>
  <textarea id="resume" placeholder="Paste your resume. The interviewer will ask about what's in it."></textarea>

  <button id="start">Start interview</button>
  <p class="note">
    Use headphones. Without them your speakers feed the interviewer's voice back
    into your microphone and it will think you're interrupting.
  </p>
</div>

<div class="card" id="room" hidden>
  <div class="head">
    <span class="role">Interview in progress</span>
    <span id="timer">10:00</span>
  </div>

  <p id="question">Connecting…</p>

  <div class="stage">
    <div id="orb" data-mode="idle"></div>
    <div id="status">Connecting…</div>
  </div>

  <div class="controls">
    <button class="ghost" id="mute">Mute</button>
    <button class="ghost" id="toggle-transcript">Show transcript</button>
    <button class="ghost" id="end">End interview</button>
  </div>

  <div id="transcript" hidden></div>
  <pre id="summary" hidden></pre>
</div>

<script src="/static/app.js"></script>
</body>
</html>
